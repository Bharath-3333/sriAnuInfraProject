server:
  port: 8080

spring:
  application:
    name: sriAnuApp

  datasource:
    url: jdbc:mysql://localhost:3306/srianu
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  liquibase:
    enabled: true
    change-log: scripts/changelog-mysql.xml